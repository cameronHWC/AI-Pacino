
<title>My Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: "Space Grotesk", -apple-system, Helvetica, Arial, sans-serif;
    font-size: 16px;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    background: #f7f7f8;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  input, button {
    font-family: inherit;
  }
  #header span {
    display: block;
  }
  #header {
    text-align: center;
    font-size: 32px; /* ~2x the chat text */
    font-weight: 700;
    line-height: 1.15;
    margin: 12px 0 24px;
  }
  #footer {
    text-align: center;
    font-size: 8px; /* ~0.5x the chat text */
    line-height: 1.5;
    color: #555;
    margin-top: auto;
    padding-top: 24px;
  }
  #footer p {
    margin: 0;
  }
  #footer a {
    color: inherit;
  }
  #messages {
    background: white;
    border-radius: 10px;
    padding: 16px;
    min-height: 400px;
    max-height: 60vh;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .msg {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user {
    background: #e6f0ff;
    margin-left: 20%;
  }
  .bot {
    background: #eee;
    margin-right: 20%;
  }
  #inputRow {
    display: flex;
    gap: 8px;
  }
  #question {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
  }
  #send {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  #send:disabled {
    opacity: 0.5;
  }
  #cornerImage {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 22vw;
    max-width: 320px;
    min-width: 90px;
    height: auto;
  }
  @media (max-width: 600px) {
    /* Each sentence on one line: font scales with screen width (max 24px) */
    #header {
      font-size: min(24px, calc((100vw - 40px) / 18.6));
      margin-bottom: 16px;
    }
    #header span {
      white-space: nowrap;
    }
    /* Chat card = scrolling messages + a fixed "dead zone" strip holding the image */
    #chatBox {
      background: white;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    #messages {
      background: none;
      margin-bottom: 0;
      min-height: 260px;
      max-height: 45vh;
      padding-bottom: 0;
    }
    #cornerImage {
      position: static;
      display: block;
      align-self: flex-end;
      width: 110px;
      min-width: 0;
      max-width: none;
      margin: 0 10px 0 0;
    }
    #footer {
      margin-top: 0;
      padding-top: 16px;
    }
  }
</style>

<h1 id="header">
  <span>ARE YOU LOST?</span>
  <span>ARE YOU LOOKING FOR AL PACINO?</span>
  <span>LOOKING TO ASK HIM A QUESTION?</span>
  <span>ASK AI PACINO INSTEAD.</span>
</h1>

<div id="chatBox">
  <div id="messages"></div>
  <img id="cornerImage" src="corner-image.png" alt="" />
</div>
<div id="inputRow">
  <input id="question" type="text" placeholder="Ask a question..." />
  <button id="send">Send</button>
</div>

<footer id="footer">
  <p>Made by <a href="https://hardworkclub.com" target="_blank" rel="noopener">Hard Work Club</a>, because we made a typo and decided to lean all the way in. Attica! Attica!</p>
  <p>This has not been endorsed, authorized, or noticed by the actual Al Pacino.</p>
</footer>

<script>
  const messagesEl = document.getElementById("messages");
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("send");

  const history = [];

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = questionEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    history.push({ role: "user", content: text });
    questionEl.value = "";
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();

      if (data.reply) {
        addMessage(data.reply, "bot");
        history.push({ role: "assistant", content: data.reply });
      } else {
        addMessage("Something went wrong: " + (data.error || "unknown error"), "bot");
      }
    } catch (err) {
      addMessage("Something went wrong reaching the server.", "bot");
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
