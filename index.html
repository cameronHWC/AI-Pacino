<meta charset="utf-8">

<title>AI Pacino</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: "Space Grotesk", -apple-system, Helvetica, Arial, sans-serif;
    font-size: 16px;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    background: #f7f7f8;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  input, button {
    font-family: inherit;
  }
  #header span {
    display: block;
  }
  #header {
    text-align: center;
    font-size: 32px; /* ~2x the chat text */
    font-weight: 700;
    line-height: 1.15;
    margin: 12px 0 24px;
  }
  #footer {
    text-align: center;
    font-size: 8px; /* ~0.5x the chat text */
    line-height: 1.5;
    color: #555;
    margin-top: auto;
    padding-top: 24px;
  }
  #footer p {
    margin: 0;
  }
  #footer a {
    color: inherit;
  }
  #messages {
    background: white;
    border-radius: 10px;
    padding: 16px;
    min-height: 400px;
    max-height: 60vh;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .msg {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user {
    background: #e6f0ff;
    margin-left: 20%;
  }
  .bot {
    background: #eee;
    margin-right: 20%;
  }
  #inputRow {
    display: flex;
    gap: 8px;
  }
  #question {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
  }
  #send {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  #send:disabled {
    opacity: 0.5;
  }
  #share {
    padding: 12px 12px;
    border-radius: 8px;
    border: 1px solid #2563eb;
    background: white;
    color: #2563eb;
    font-size: 15px;
    cursor: pointer;
  }
  #share:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #cornerImage {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 22vw;
    max-width: 320px;
    min-width: 90px;
    height: auto;
  }
  @media (max-width: 600px) {
    /* Each sentence on one line: font scales with screen width (max 24px) */
    #header {
      font-size: min(24px, calc((100vw - 40px) / 18.6));
      margin-bottom: 16px;
    }
    #header span {
      white-space: nowrap;
    }
    /* Chat card = scrolling messages + a fixed "dead zone" strip holding the image */
    #chatBox {
      background: white;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    #messages {
      background: none;
      margin-bottom: 0;
      min-height: 260px;
      max-height: 45vh;
      padding-bottom: 0;
    }
    #cornerImage {
      position: static;
      display: block;
      align-self: flex-end;
      width: 110px;
      min-width: 0;
      max-width: none;
      margin: 0 10px 0 0;
    }
    #footer {
      margin-top: 0;
      padding-top: 16px;
    }
    #send, #share {
      padding: 12px 14px;
    }
  }
</style>

<h1 id="header">
  <span>ARE YOU LOST?</span>
  <span>ARE YOU LOOKING FOR AL PACINO?</span>
  <span>LOOKING TO ASK HIM A QUESTION?</span>
  <span>ASK AI PACINO INSTEAD.</span>
</h1>

<div id="chatBox">
  <div id="messages"></div>
  <img id="cornerImage" src="corner-image.png" alt="" />
</div>
<div id="inputRow">
  <input id="question" type="text" placeholder="Whaddya wanna know..." maxlength="500" />
  <button id="send">Send</button>
  <button id="share" disabled title="Share this chat as an image">Share</button>
</div>

<footer id="footer">
  <p>Made by <a href="https://hardworkclub.com" target="_blank" rel="noopener">Hard Work Club</a>, because we made a typo and decided to lean all the way in. Attica! Attica!</p>
  <p>This has not been endorsed, authorized, or noticed by the actual Al Pacino.</p>
</footer>

<script>
  const messagesEl = document.getElementById("messages");
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const shareBtn = document.getElementById("share");

  const history = [];

  // Shown when the site reaches the server but the call to Claude fails
  const API_ERROR_LINES = [
    "Whoa, whoa, whoa. Something just blew up in the back room. Gimme a second and ask me again.",
    "Hold on. HOLD ON. My people dropped the ball. Ask me again.",
    "You hear that? That's the sound of something breaking. Not my fault. Try me again.",
    "I had the answer. I HAD it. And then it was gone. Ask me one more time.",
    "Somebody in the back is getting yelled at right now. Give it a second and try again.",
  ];

  // Shown when the site can't reach the server at all
  const NETWORK_ERROR_LINES = [
    "I can't hear you, kid. The line went dead. Check your connection and try me again.",
    "Hello? HELLO? You're breaking up on me. Check your connection and try again.",
    "We got cut off. I don't like getting cut off. Check your connection and ask again.",
    "You went quiet on me. I don't trust quiet. Check your signal and try again.",
    "Nothing's getting through. Not a word. Check your connection and come back to me.",
  ];

  // Shown when a visitor sends too many messages too fast (firewall rate limit)
  const SLOW_DOWN_LINES = [
    "Easy. EASY. One question at a time. Take a breath and try me again in a minute.",
    "You're talking too fast, kid. Slow down. Come back in a minute.",
    "Whoa. You're rushing me. Nobody rushes me. Give it a minute.",
  ];

  // Shown when the monthly budget has been used up
  const CLOSED_LINES = [
    "That's it. We're closed for the month. Too many people wanted a piece of me. Come back on the 1st.",
    "I gave everything I had this month. Everything. Come back on the 1st and we'll talk.",
  ];

  function pickLine(lines) {
    return lines[Math.floor(Math.random() * lines.length)];
  }

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    shareBtn.disabled = false;
  }

  async function sendMessage() {
    const text = questionEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    history.push({ role: "user", content: text });
    questionEl.value = "";
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-10) }),
      });

      let data = {};
      try {
        data = await res.json();
      } catch (e) {
        // Server answered but not with JSON (e.g. a timeout page)
      }

      if (res.ok && data.reply) {
        addMessage(data.reply, "bot");
        history.push({ role: "assistant", content: data.reply });
      } else {
        console.error("API error:", res.status, data.error);
        history.pop(); // drop the unanswered question so the conversation stays clean
        if (data.code === "LIMIT_REACHED") {
          addMessage(pickLine(CLOSED_LINES), "bot");
        } else if (res.status === 429) {
          addMessage(pickLine(SLOW_DOWN_LINES), "bot");
        } else {
          addMessage(pickLine(API_ERROR_LINES), "bot");
        }
      }
    } catch (err) {
      console.error("Network error:", err);
      history.pop();
      addMessage(pickLine(NETWORK_ERROR_LINES), "bot");
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  // ---------- Share: turn the messages visible in the chat box into a 4:5 image ----------
  const SITE_URL = "https://chatwithaipacino.com";
  const HEADER_LINES = [
    "ARE YOU LOST?",
    "ARE YOU LOOKING FOR AL PACINO?",
    "LOOKING TO ASK HIM A QUESTION?",
    "ASK AI PACINO INSTEAD.",
  ];

  // Messages at least partly in view inside the chat box right now
  function getVisibleMessages() {
    const box = messagesEl.getBoundingClientRect();
    return [...messagesEl.querySelectorAll(".msg")]
      .filter((el) => {
        const r = el.getBoundingClientRect();
        return r.bottom > box.top + 4 && r.top < box.bottom - 4;
      })
      .map((el) => ({ who: el.classList.contains("user") ? "user" : "bot", text: el.textContent }));
  }

  function wrapText(ctx, text, maxWidth) {
    const lines = [];
    for (const para of text.split("\n")) {
      let line = "";
      for (const word of para.split(" ")) {
        const test = line ? line + " " + word : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      lines.push(line);
    }
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  async function buildShareImage(messages) {
    const W = 1080, H = 1350, PAD = 60;
    const FONT = '"Space Grotesk", Helvetica, Arial, sans-serif';
    await Promise.all([
      document.fonts.load('700 40px "Space Grotesk"'),
      document.fonts.load('400 30px "Space Grotesk"'),
    ]);
    const pacino = await loadImage("corner-image.png");

    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    // Background
    ctx.fillStyle = "#f7f7f8";
    ctx.fillRect(0, 0, W, H);

    // Header
    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const headSize = 52;
    ctx.font = `700 ${headSize}px ${FONT}`;
    HEADER_LINES.forEach((line, i) => ctx.fillText(line, W / 2, PAD + i * headSize * 1.12));
    const headerBottom = PAD + HEADER_LINES.length * headSize * 1.12 + 30;

    // Chat card
    const footerH = 90;
    const pacinoW = 250, pacinoH = pacinoW * (pacino.height / pacino.width);
    const cardX = PAD, cardY = headerBottom, cardW = W - PAD * 2;
    const cardH = H - headerBottom - footerH - 20;
    ctx.fillStyle = "#fff";
    roundRect(ctx, cardX, cardY, cardW, cardH, 24);
    ctx.fill();

    // Lay out bubbles, shrinking text until everything fits above Pacino's dead zone
    const inner = 32, bubblePadX = 26, bubblePadY = 18, gap = 18;
    const bubbleMaxW = cardW * 0.78;
    const availH = cardH - inner * 2 - pacinoH + 20;
    let size = 34, layout;
    let msgs = messages.slice();
    while (true) {
      ctx.font = `400 ${size}px ${FONT}`;
      const lh = size * 1.35;
      layout = msgs.map((m) => {
        const lines = wrapText(ctx, m.text, bubbleMaxW - bubblePadX * 2);
        const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + bubblePadX * 2;
        return { ...m, lines, w, h: lines.length * lh + bubblePadY * 2, lh };
      });
      const total = layout.reduce((a, b) => a + b.h, 0) + gap * (layout.length - 1);
      if (total <= availH) break;
      if (size > 20) { size -= 2; continue; }
      if (msgs.length > 1) { msgs.shift(); size = 34; continue; } // drop oldest if it still won't fit
      break;
    }

    ctx.textAlign = "left";
    let y = cardY + inner;
    for (const b of layout) {
      const x = b.who === "user" ? cardX + cardW - inner - b.w : cardX + inner;
      ctx.fillStyle = b.who === "user" ? "#e6f0ff" : "#eeeeee";
      roundRect(ctx, x, y, b.w, b.h, 20);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.font = `400 ${size}px ${FONT}`;
      b.lines.forEach((line, i) => ctx.fillText(line, x + bubblePadX, y + bubblePadY + i * b.lh + (b.lh - size) / 2));
      y += b.h + gap;
    }

    // Pacino in the bottom-right corner of the card
    ctx.drawImage(pacino, cardX + cardW - pacinoW - 10, cardY + cardH - pacinoH, pacinoW, pacinoH);

    // Footer
    ctx.textAlign = "center";
    ctx.fillStyle = "#000";
    ctx.font = `700 30px ${FONT}`;
    ctx.fillText("Ask him yourself → chatwithaipacino.com", W / 2, H - footerH + 8);
    ctx.fillStyle = "#555";
    ctx.font = `400 20px ${FONT}`;
    ctx.fillText("Made by Hard Work Club. Not endorsed, authorized, or noticed by the actual Al Pacino.", W / 2, H - footerH + 50);

    return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  }

  async function shareChat() {
    const messages = getVisibleMessages();
    if (!messages.length) return;
    shareBtn.disabled = true;
    try {
      const blob = await buildShareImage(messages);
      const file = new File([blob], "ai-pacino.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "AI Pacino", text: "I asked AI Pacino, so should you. " + SITE_URL });
      } else {
        // Desktop fallback: download the image
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ai-pacino.png";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
    } catch (err) {
      if (err.name !== "AbortError") console.error("Share failed:", err);
    } finally {
      shareBtn.disabled = false;
    }
  }

  shareBtn.addEventListener("click", shareChat);
  sendBtn.addEventListener("click", sendMessage);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
